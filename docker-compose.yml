services:
  ohif-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ohif-viewer
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      PORT: ${PORT:-8081}
      WADO_URI_ROOT: ${WADO_URI_ROOT:-/dcm4chee-arc/aets/DCM4CHEE/wado}
      QIDO_ROOT: ${QIDO_ROOT:-/dcm4chee-arc/aets/DCM4CHEE/rs}
      WADO_ROOT: ${WADO_ROOT:-/dcm4chee-arc/aets/DCM4CHEE/rs}
    volumes:
      - ./.docker/Viewer-v3.x/default.conf.template:/usr/src/default.conf.template:ro
      - ./platform/app/public/config/default.js:/usr/src/app-config.default.js:ro
    networks:
      - pacs-net
    restart: unless-stopped

networks:
  pacs-net:
    external: true
    name: pacs-emergencia_default
